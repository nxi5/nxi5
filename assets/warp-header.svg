<svg xmlns="http://www.w3.org/2000/svg" width="850" height="240" viewBox="0 0 850 240">
  <defs>
    <radialGradient id="space" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0b0221"/>
      <stop offset="100%" stop-color="#020010"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="850" height="240" fill="url(#space)"/>

  <!-- warp lines flying outward (parallax layers) -->
  <g stroke-linecap="round">
    <g stroke="#8b5cf6" stroke-width="1.6" opacity="0.9">
      <line x1="425" y1="120" x2="470" y2="120"><animate attributeName="x2" values="470;760" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.6s" repeatCount="indefinite"/></line>
      <line x1="425" y1="120" x2="465" y2="90"><animate attributeName="x2" values="465;780" y2="20" dur="2.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.1s" repeatCount="indefinite"/></line>
      <line x1="425" y1="120" x2="460" y2="150"><animate attributeName="x2" values="460;790" y2="200" dur="1.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.9s" repeatCount="indefinite"/></line>
    </g>
    <g stroke="#0ea5e9" stroke-width="1.2" opacity="0.8">
      <line x1="425" y1="120" x2="400" y2="100"><animate attributeName="x2" values="400;90" y2="40" dur="2.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.3s" repeatCount="indefinite"/></line>
      <line x1="425" y1="120" x2="405" y2="140"><animate attributeName="x2" values="405;60" y2="190" dur="1.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="1.7s" repeatCount="indefinite"/></line>
      <line x1="425" y1="120" x2="398" y2="120"><animate attributeName="x2" values="398;70" dur="2.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.6s" repeatCount="indefinite"/></line>
    </g>
    <g stroke="#2ea043" stroke-width="1" opacity="0.7">
      <line x1="425" y1="120" x2="450" y2="70"><animate attributeName="x2" values="450;700" y2="10" dur="2.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.8s" repeatCount="indefinite"/></line>
      <line x1="425" y1="120" x2="445" y2="165"><animate attributeName="x2" values="445;720" y2="225" dur="2.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite"/></line>
      <line x1="425" y1="120" x2="380" y2="85"><animate attributeName="x2" values="380;140" y2="25" dur="3.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="3.1s" repeatCount="indefinite"/></line>
      <line x1="425" y1="120" x2="385" y2="152"><animate attributeName="x2" values="385;120" y2="215" dur="2.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.9s" repeatCount="indefinite"/></line>
    </g>
  </g>

  <!-- twinkling stars -->
  <g fill="#ffffff">
    <circle cx="120" cy="45" r="1.4"><animate attributeName="opacity" values="0.1;1;0.1" dur="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="60" r="1.2"><animate attributeName="opacity" values="1;0.1;1" dur="1.7s" repeatCount="indefinite"/></circle>
    <circle cx="210" cy="190" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="185" r="1.3"><animate attributeName="opacity" values="1;0.15;1" dur="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="120" r="1.1"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="790" cy="130" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- title -->
  <text x="425" y="112" text-anchor="middle" font-family="Consolas, monospace" font-size="42" font-weight="bold" fill="#ffffff" filter="url(#glow)">nxi5</text>
  <text x="425" y="145" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#a78bfa">⚠ WARNING: this profile is haunted ⚠</text>
</svg>
