<svg xmlns="http://www.w3.org/2000/svg" width="850" height="250" viewBox="0 0 850 250">
  <defs>
    <linearGradient id="holo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffe6fb">
        <animate attributeName="stop-color" values="#ffe6fb;#e0f7ff;#f0ffdf;#ffe6fb" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#e0f7ff">
        <animate attributeName="stop-color" values="#e0f7ff;#f0ffdf;#ffd6f5;#e0f7ff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#d8ffe9">
        <animate attributeName="stop-color" values="#d8ffe9;#ffe6fb;#e0f7ff;#d8ffe9" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#d7e0ef"/>
      <stop offset="55%" stop-color="#95a3bd"/>
      <stop offset="100%" stop-color="#f2f7ff"/>
    </linearGradient>
    <filter id="pinkglow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="3" stdDeviation="0" flood-color="#ff6ec7"/>
      <feDropShadow dx="3" dy="0" stdDeviation="0" flood-color="#00f0ff"/>
    </filter>
  </defs>
  <rect width="850" height="250" fill="url(#holo)"/>

  <!-- rising bubbles -->
  <g fill="#ffffff" opacity="0.55">
    <circle cx="120" r="7" cy="260"><animate attributeName="cy" values="260;30" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="700" r="5" cy="260"><animate attributeName="cy" values="260;20" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.7;0" dur="9s" repeatCount="indefinite"/></circle>
    <circle cx="300" r="4" cy="260"><animate attributeName="cy" values="260;40" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.8;0" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="560" r="6" cy="260"><animate attributeName="cy" values="260;50" dur="8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.6;0" dur="8s" repeatCount="indefinite"/></circle>
  </g>

  <!-- sparkles -->
  <g fill="#ff6ec7">
    <text x="90" y="70" font-size="18">✦<animate attributeName="opacity" values="0.2;1;0.2" dur="1.4s" repeatCount="indefinite"/></text>
    <text x="760" y="60" font-size="15" fill="#00c8ff">✦<animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/></text>
    <text x="150" y="190" font-size="14" fill="#9d4bff">✧<animate attributeName="opacity" values="0.3;1;0.3" dur="2.1s" repeatCount="indefinite"/></text>
    <text x="700" y="185" font-size="17" fill="#ff6ec7">✦<animate attributeName="opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/></text>
  </g>

  <!-- chrome 3D title -->
  <g filter="url(#pinkglow)">
    <text x="425" y="118" text-anchor="middle" font-family="Arial Black, Arial" font-size="56" font-weight="900" fill="url(#chrome)" stroke="#7a86b8" stroke-width="1">nxi5</text>
  </g>
  <text x="425" y="152" text-anchor="middle" font-family="Verdana" font-size="14" fill="#ff4fb8">✦ holo profile · y2k forever · no dark mode here ✦</text>

  <!-- y2k marquee -->
  <rect y="216" width="850" height="34" fill="#ffffff" opacity="0.65"/>
  <g font-family="Verdana" font-size="13" font-weight="bold" fill="#b048ff">
    <text x="850" y="238">✦ WELCOME 2 MY PAGE ✦ CYBER EDITION ✦ BEST VIEWED WITH YOUR EYES ✦ HOLOGRAPHIC VIBES ONLY ✦ EST. Y2K ✦</text>
    <animateTransform attributeName="transform" type="translate" values="0,0; -940,0" dur="11s" repeatCount="indefinite"/>
  </g>
  <text x="12" y="238" font-family="Verdana" font-size="13" font-weight="bold" fill="#00b8e0">✦ WELCOME 2 MY PAGE ✦ CYBER EDITION</text>
</svg>
