<svg xmlns="http://www.w3.org/2000/svg" width="850" height="260" viewBox="0 0 850 260">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#030014"/>
      <stop offset="100%" stop-color="#12033a"/>
    </linearGradient>
    <radialGradient id="beam" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#b4f8ff" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#b4f8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="1.2"/></filter>
  </defs>
  <rect width="850" height="260" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#fff">
    <circle cx="80" cy="40" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="200" cy="25" r="1.1"><animate attributeName="opacity" values="1;0.2;1" dur="1.9s" repeatCount="indefinite"/></circle>
    <circle cx="330" cy="55" r="1.4"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="500" cy="30" r="1.2"><animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="660" cy="48" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="790" cy="35" r="1.2"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="150" r="1.1"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="740" cy="160" r="1.2"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>

  <!-- UFO group: flies across, bobs, beams a star up -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="-160,30; 1010,30" dur="14s" repeatCount="indefinite"/>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-7; 0,0" dur="2.4s" repeatCount="indefinite"/>
      <!-- tractor beam -->
      <path d="M0 66 L-38 165 L38 165 Z" fill="url(#beam)" opacity="0.75">
        <animate attributeName="opacity" values="0.35;0.85;0.35" dur="1.8s" repeatCount="indefinite"/>
      </path>
      <!-- abducted star floating up the beam -->
      <circle cx="0" cy="150" r="3.2" fill="#ffe066" filter="url(#soft)">
        <animate attributeName="cy" values="160;80" dur="3.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="1;0.2" dur="3.6s" repeatCount="indefinite"/>
      </circle>
      <!-- saucer -->
      <ellipse cx="0" cy="60" rx="52" ry="14" fill="#5f6f8f"/>
      <ellipse cx="0" cy="57" rx="52" ry="11" fill="#8fa3c7"/>
      <path d="M-24 50 Q0 26 24 50 Z" fill="#b9e7ff" opacity="0.9"/>
      <!-- blinking lights -->
      <circle cx="-30" cy="58" r="3" fill="#ff5470"><animate attributeName="opacity" values="1;0.15;1" dur="0.7s" repeatCount="indefinite"/></circle>
      <circle cx="-10" cy="61" r="3" fill="#ffe066"><animate attributeName="opacity" values="0.15;1;0.15" dur="0.7s" repeatCount="indefinite"/></circle>
      <circle cx="10" cy="61" r="3" fill="#ff5470"><animate attributeName="opacity" values="1;0.15;1" dur="0.7s" repeatCount="indefinite"/></circle>
      <circle cx="30" cy="58" r="3" fill="#ffe066"><animate attributeName="opacity" values="0.15;1;0.15" dur="0.7s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <!-- caption -->
  <text x="425" y="225" text-anchor="middle" font-family="Consolas, monospace" font-size="14" fill="#7dd3fc">they took the stars. they are coming back for the commits. 👽</text>
</svg>
