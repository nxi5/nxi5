<svg xmlns="http://www.w3.org/2000/svg" width="850" height="260" viewBox="0 0 850 260">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9ecff">
        <animate attributeName="stop-color" values="#c9ecff;#ffd9f3;#d9ffe9;#c9ecff" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6ec7"/>
      <stop offset="50%" stop-color="#b06cff"/>
      <stop offset="100%" stop-color="#00d0ff"/>
    </linearGradient>
  </defs>
  <rect width="850" height="260" fill="url(#sky)"/>

  <!-- y2k sun with spinning rays -->
  <g transform="translate(760,60)">
    <g stroke="#ffd23e" stroke-width="3" opacity="0.85">
      <line x1="0" y1="-34" x2="0" y2="-46"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/></line>
      <line x1="24" y1="-24" x2="32" y2="-32"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/></line>
      <line x1="34" y1="0" x2="46" y2="0"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/></line>
    </g>
    <circle r="24" fill="#ffe95c"><animate attributeName="fill" values="#ffe95c;#ffc2e0;#a5f3ff;#ffe95c" dur="10s" repeatCount="indefinite"/></circle>
    <circle r="24" fill="none" stroke="#fff" stroke-width="2" opacity="0.7"/>
  </g>

  <!-- fluffy clouds drifting -->
  <g fill="#ffffff" opacity="0.9">
    <g><ellipse cx="150" cy="80" rx="46" ry="20"/><ellipse cx="185" cy="70" rx="34" ry="16"/><animate attributeName="transform" type="translate" values="0,0; 40,0; 0,0" dur="16s" repeatCount="indefinite"/></g>
    <g><ellipse cx="520" cy="150" rx="54" ry="22"/><ellipse cx="480" cy="158" rx="36" ry="16"/><animate attributeName="transform" type="translate" values="0,0; -50,0; 0,0" dur="20s" repeatCount="indefinite"/></g>
  </g>

  <!-- holographic butterfly flapping across -->
  <g transform="translate(0,120)">
    <animateTransform attributeName="transform" type="translate" values="-80,140; 930,60" dur="12s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="-80,120; 930,70" dur="12s" repeatCount="indefinite" additive="sum"/>
    <g>
      <!-- left wing -->
      <path d="M0 0 C-30 -34, -58 -20, -40 2 C-58 18, -26 30, 0 6 Z" fill="url(#wing)" opacity="0.9">
        <animateTransform attributeName="transform" type="scale" values="1 1; 0.25 1; 1 1" dur="0.5s" repeatCount="indefinite"/>
      </path>
      <!-- right wing -->
      <path d="M0 0 C30 -34, 58 -20, 40 2 C58 18, 26 30, 0 6 Z" fill="url(#wing)" opacity="0.9">
        <animateTransform attributeName="transform" type="scale" values="1 1; 0.25 1; 1 1" dur="0.5s" repeatCount="indefinite"/>
      </path>
      <ellipse cx="0" cy="2" rx="3.4" ry="10" fill="#5b2a86"/>
      <circle cx="-2" cy="-6" r="2" fill="#5b2a86"/>
    </g>
  </g>

  <!-- sparkle trail -->
  <g fill="#ff6ec7">
    <text x="380" y="220" font-size="16">✦<animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/></text>
    <text x="450" y="200" font-size="12" fill="#00c8ff">✧<animate attributeName="opacity" values="0;1;0" dur="3.6s" repeatCount="indefinite"/></text>
    <text x="250" y="235" font-size="14" fill="#b06cff">✦<animate attributeName="opacity" values="0;1;0" dur="4.2s" repeatCount="indefinite"/></text>
  </g>

  <text x="425" y="245" text-anchor="middle" font-family="Verdana" font-size="13" fill="#e24fb4">butterfly approved zone · zero dark mode detected ✦</text>
</svg>
