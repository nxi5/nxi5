name: "⏰ living clock"
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: sync time
        env:
          TZ: "Africa/Cairo"
        run: python .github/scripts/living.py
      - name: commit the tick
        run: |
          git config user.name "the-clock[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/living-clock.svg
          git commit -m "tick: the clock keeps ticking" || exit 0
          git push
