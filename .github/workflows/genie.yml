name: "🧞 the genie"
on:
  issues:
    types: [opened]
permissions:
  issues: write
  contents: write

jobs:
  grant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: grant a fortune
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
          ASKER: ${{ github.event.issue.user.login }}
          TITLE: ${{ github.event.issue.title }}
        run: python .github/scripts/genie.py
      - name: mutate the profile
        run: |
          git config user.name "the-genie[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/crystal-ball.svg
          git commit -m "genie: a fortune was granted to @${{ github.event.issue.user.login }}"
          git push
